<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Bot Demo — Portfolio Sample</title>
  <meta name="description" content="Demo AI chatbot for customer support. Built with vanilla JS. Portfolio showcase.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a2e;
      --bg-chat: #16162a;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --accent-light: #a29bfe;
      --success: #00d2d3;
      --warning: #feca57;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #555570;
      --border: rgba(255,255,255,0.06);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .demo-header {
      width: 100%;
      padding: 16px 24px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .demo-brand .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--success));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .demo-brand span {
      font-weight: 600;
      font-size: 16px;
    }

    .demo-badge {
      background: rgba(108,92,231,0.15);
      color: var(--accent-light);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(108,92,231,0.2);
    }

    /* Main Layout */
    .main-container {
      width: 100%;
      max-width: 900px;
      padding: 32px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .section-title h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Chat Container */
    .chat-container {
      background: var(--bg-chat);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 500px;
      max-height: 600px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), #e056a0);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .bot-info h3 { font-size: 15px; font-weight: 600; }
    .bot-info .status {
      font-size: 12px;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bot-info .status::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot .msg-avatar {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #e056a0);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .msg-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.bot .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.user .msg-bubble {
      background: linear-gradient(135deg, var(--accent), #5a4bd1);
      border-bottom-right-radius: 4px;
    }

    .msg-bubble a {
      color: var(--accent-light);
      text-decoration: underline;
    }

    /* Quick Replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-reply-btn {
      background: rgba(108,92,231,0.1);
      border: 1px solid rgba(108,92,231,0.3);
      color: var(--accent-light);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .quick-reply-btn:hover {
      background: rgba(108,92,231,0.25);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-items: center;
    }

    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input */
    .chat-input {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: var(--accent);
    }

    .chat-input input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), #5a4bd1);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .stat-card .stat-value {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-light), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .demo-footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .demo-footer a {
      color: var(--accent-light);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .msg-bubble { max-width: 85%; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="demo-header">
    <div class="demo-brand">
      <div class="logo">🤖</div>
      <span>AI Support Bot</span>
    </div>
    <div class="demo-badge">Live Demo</div>
  </header>

  <!-- Main -->
  <div class="main-container">
    <div class="section-title">
      <h1>AI Customer Support Bot</h1>
    </div>
    <p class="section-subtitle">
      Intelligent chatbot that handles customer inquiries 24/7. Try it below!
    </p>

    <!-- Chat -->
    <div class="chat-container">
      <div class="chat-header">
        <div class="bot-avatar">🤖</div>
        <div class="bot-info">
          <h3>Support Assistant</h3>
          <div class="status">Online — Ready to help</div>
        </div>
      </div>

      <div class="messages" id="messages">
        <!-- Messages rendered by JS -->
      </div>

      <div class="chat-input">
        <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="stat-msgs">0</div>
        <div class="stat-label">Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">1.2s</div>
        <div class="stat-label">Avg Response</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">95%</div>
        <div class="stat-label">Resolution</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">24/7</div>
        <div class="stat-label">Availability</div>
      </div>
    </div>
  </div>

  <footer class="demo-footer">
    Built by <a href="#">AIFlowBuilder</a> — Custom AI Chatbot Development
  </footer>

  <script>
    // Knowledge Base - simulating trained business data
    const knowledgeBase = {
      greetings: [
        "Hello! 👋 I'm the AI Support Assistant. How can I help you today?",
        "Welcome! I'm here to help with any questions about our services."
      ],
      pricing: {
        keywords: ["price", "cost", "pricing", "how much", "plan", "subscription", "pay"],
        response: "Great question! Here are our plans:\n\n💫 **Starter** — $29/mo\n→ Up to 1,000 conversations/month\n→ Website widget\n→ Email support\n\n⭐ **Growth** — $79/mo\n→ Up to 10,000 conversations/month\n→ Multi-channel (Web + WhatsApp)\n→ Analytics dashboard\n→ Priority support\n\n🚀 **Enterprise** — Custom pricing\n→ Unlimited conversations\n→ Custom AI training\n→ Dedicated account manager\n→ API access\n\nWould you like to start a free trial?"
      },
      features: {
        keywords: ["feature", "what can", "capabilities", "do you", "functions", "able to"],
        response: "Our AI chatbot can do a lot! Here's what's included:\n\n✅ **24/7 Customer Support** — Never miss a question\n✅ **Lead Qualification** — Automatically score and route leads\n✅ **Knowledge Base Training** — Train on YOUR business data\n✅ **Multi-Language** — Support in 29+ languages\n✅ **CRM Integration** — Sync with HubSpot, Salesforce, etc.\n✅ **Analytics Dashboard** — Track every conversation\n✅ **Human Handoff** — Seamlessly transfer to live agents\n\nWant to know more about any specific feature?"
      },
      integration: {
        keywords: ["integrate", "connect", "crm", "zapier", "slack", "api", "webhook", "shopify", "wordpress"],
        response: "We integrate with all major platforms:\n\n🔗 **CRM:** HubSpot, Salesforce, Pipedrive\n🔗 **Communication:** Slack, Microsoft Teams, Discord\n🔗 **E-commerce:** Shopify, WooCommerce, BigCommerce\n🔗 **Website:** WordPress, Webflow, Custom HTML\n🔗 **Automation:** Zapier, Make.com, n8n\n🔗 **Messaging:** WhatsApp, Facebook Messenger, Telegram\n\nPlus a REST API for custom integrations!\n\nWhich platform are you using?"
      },
      setup: {
        keywords: ["setup", "install", "get started", "how to", "start", "begin", "trial"],
        response: "Getting started is super easy! Here's the process:\n\n**Step 1:** Sign up for a free 14-day trial (no credit card needed)\n**Step 2:** Upload your FAQs, website URL, or knowledge base docs\n**Step 3:** Customize the bot's appearance and personality\n**Step 4:** Add one line of code to your website\n**Step 5:** You're live! 🎉\n\nThe whole process takes about 15 minutes.\n\nShall I help you get started right now?"
      },
      support: {
        keywords: ["help", "support", "issue", "problem", "bug", "error", "not working"],
        response: "I'm sorry to hear you're having trouble! Let me help.\n\nFor immediate assistance:\n📧 Email: support@example.com\n💬 Live chat: Available Mon-Fri 9am-6pm EST\n📚 Help docs: docs.example.com\n\nOr describe your issue here and I'll try to resolve it right away! Common solutions:\n\n1. **Widget not showing?** → Check if the script is in the <head> tag\n2. **Bot not responding?** → Verify your API key is active\n3. **Wrong answers?** → Retrain with updated knowledge base\n\nWhat issue are you experiencing?"
      },
      demo: {
        keywords: ["demo", "example", "show me", "see", "preview", "test"],
        response: "You're already interacting with our demo! 🎉\n\nThis chatbot demonstrates:\n→ Natural conversation flow\n→ Quick reply suggestions\n→ Smart topic detection\n→ Professional UI/UX\n→ Real-time responses\n\nImagine this, but trained on YOUR business data — answering questions about YOUR products and services.\n\nWant to see how it would work for your specific business?"
      },
      fallback: [
        "That's a great question! Let me make sure I understand correctly. Could you provide a bit more detail?",
        "I want to make sure I give you the best answer. Could you rephrase that or provide more context?",
        "Interesting question! While I'm still learning, I can connect you with our team for a detailed answer. Would you like that?"
      ]
    };

    let messageCount = 0;

    // Init
    function init() {
      addBotMessage(knowledgeBase.greetings[0], [
        "What are your pricing plans?",
        "What features do you offer?",
        "How do I get started?",
        "Show me a demo"
      ]);
    }

    function addBotMessage(text, quickReplies = []) {
      const messagesDiv = document.getElementById('messages');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message bot';

      let html = `<div class="msg-avatar">🤖</div><div><div class="msg-bubble">${formatText(text)}</div>`;

      if (quickReplies.length > 0) {
        html += '<div class="quick-replies">';
        quickReplies.forEach(reply => {
          html += `<button class="quick-reply-btn" onclick="handleQuickReply('${reply.replace(/'/g, "\\'")}')">${reply}</button>`;
        });
        html += '</div>';
      }

      html += '</div>';
      msgDiv.innerHTML = html;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addUserMessage(text) {
      const messagesDiv = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      msgDiv.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      messageCount++;
      document.getElementById('stat-msgs').textContent = messageCount;
    }

    function showTyping() {
      const messagesDiv = document.getElementById('messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typing-indicator';
      typingDiv.innerHTML = `<div class="msg-avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function findResponse(input) {
      const lower = input.toLowerCase();

      for (const [topic, data] of Object.entries(knowledgeBase)) {
        if (topic === 'greetings' || topic === 'fallback') continue;
        if (data.keywords && data.keywords.some(kw => lower.includes(kw))) {
          return { text: data.response, topic };
        }
      }

      // Check greetings
      const greetWords = ['hi', 'hello', 'hey', 'good morning', 'good afternoon', 'howdy'];
      if (greetWords.some(g => lower.includes(g))) {
        return { text: knowledgeBase.greetings[1], topic: 'greeting' };
      }

      // Fallback
      const fallbacks = knowledgeBase.fallback;
      return { text: fallbacks[Math.floor(Math.random() * fallbacks.length)], topic: 'fallback' };
    }

    function getQuickReplies(topic) {
      const replies = {
        pricing: ["Start free trial", "Compare plans", "Talk to sales"],
        features: ["See integrations", "View pricing", "Start free trial"],
        integration: ["View pricing", "How to get started?", "Talk to sales"],
        setup: ["View pricing", "What features are included?", "Talk to sales"],
        support: ["View pricing", "What features do you offer?", "Show me a demo"],
        demo: ["View pricing", "How do I get started?", "See integrations"],
        greeting: ["What are your pricing plans?", "What features do you offer?", "How do I get started?"],
        fallback: ["View pricing", "See features", "Get started"]
      };
      return replies[topic] || replies.fallback;
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = '';

      showTyping();

      const delay = 800 + Math.random() * 1200;
      setTimeout(() => {
        hideTyping();
        const response = findResponse(text);
        addBotMessage(response.text, getQuickReplies(response.topic));
      }, delay);
    }

    function handleQuickReply(text) {
      addUserMessage(text);
      showTyping();

      const delay = 600 + Math.random() * 800;
      setTimeout(() => {
        hideTyping();
        const response = findResponse(text);
        addBotMessage(response.text, getQuickReplies(response.topic));
      }, delay);
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>')
        .replace(/→/g, '→');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key
    document.getElementById('user-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Init
    init();
  </script>
</body>
</html>
